<!DOCTYPE html>
<html lang="lus">
<head>
<meta charset="utf-8">
<title>MFEB HLA BU</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe8e2">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe8e2; --bgrgb:235,232,226; --text:#1c1b19; --muted:rgba(28,27,25,.62);
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.22);
  --edge:rgba(255,255,255,.75); --edge2:rgba(0,0,0,.06);
  --shadow:0 10px 30px rgba(60,50,40,.14);
  --accent:#4a3fb0; --accent-soft:rgba(74,63,176,.14); --heart:#e8365f;
  --b1:#b9b0ff; --b2:#9fe0e6; --b3:#ffc9b8; --blobA:.75;
  --lyric:21px;
  box-sizing:border-box;
  --sat:max(env(safe-area-inset-top,0px),var(--native-sat,0px));
  --top:max(var(--sat),36px);
  --sab:max(env(safe-area-inset-bottom,0px),var(--native-sab,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151515; --bgrgb:21,21,21; --text:#f4f2ee; --muted:rgba(244,242,238,.62);
    --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.03);
    --edge:rgba(255,255,255,.34); --edge2:rgba(255,255,255,.07);
    --shadow:0 12px 34px rgba(0,0,0,.45);
    --accent:#a9b8ff; --accent-soft:rgba(169,184,255,.16); --heart:#ff5d84;
    --b1:#4a3fb0; --b2:#14808c; --b3:#b5533f; --blobA:.42;
  }
}
:root[data-theme="dark"]{
  --bg:#151515; --bgrgb:21,21,21; --text:#f4f2ee; --muted:rgba(244,242,238,.62);
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.03);
  --edge:rgba(255,255,255,.34); --edge2:rgba(255,255,255,.07);
  --shadow:0 12px 34px rgba(0,0,0,.45);
  --accent:#a9b8ff; --accent-soft:rgba(169,184,255,.16); --heart:#ff5d84;
  --b1:#4a3fb0; --b2:#14808c; --b3:#b5533f; --blobA:.42;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);color-scheme:light dark}
html[data-theme="light"]{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--blobA);
  background:
   radial-gradient(60% 40% at 15% 8%,var(--b1),transparent 70%),
   radial-gradient(55% 40% at 95% 45%,var(--b2),transparent 70%),
   radial-gradient(60% 45% at 20% 100%,var(--b3),transparent 70%);
  transition:opacity .4s}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* liquid glass */
.glass{position:relative;background:linear-gradient(140deg,var(--glass),var(--glass2));
  -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  border:1px solid var(--edge2);
  box-shadow:inset 0 1.5px 0 var(--edge),inset 0 -1px 0 var(--edge2),inset 1px 0 0 var(--glass),var(--shadow);}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 20% -10%,rgba(255,255,255,.22),transparent 55%);opacity:.7}
.press{transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .25s,box-shadow .25s}
.press:active{transform:scale(.94)}

#app{position:relative;z-index:1;height:100%;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(90px + var(--top)) 16px calc(124px + var(--sab));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.view{max-width:640px;margin:0 auto}
.view.in{animation:vin .45s cubic-bezier(.2,.8,.2,1) both}
.view.in-r{animation:vinr .45s cubic-bezier(.2,.8,.2,1) both}
.view.in-l{animation:vinl .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@keyframes vinr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes vinl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* status bar gradient header */
.sbar{position:absolute;z-index:19;left:0;right:0;top:0;height:calc(var(--top) + 30px);pointer-events:none;
  background:linear-gradient(to bottom,rgba(var(--bgrgb),.94) 0%,rgba(var(--bgrgb),.72) 45%,rgba(var(--bgrgb),0) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);transition:background .4s}
/* header */
.top{position:absolute;z-index:20;left:12px;right:12px;top:calc(var(--top) + 12px);height:58px;border-radius:29px;display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.logo{width:42px;height:42px;border-radius:14px;background:#151515;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{font-size:19px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;flex:none}
.top .ib{background:var(--glass)}

/* menu */
.menu{position:absolute;z-index:40;right:12px;top:calc(78px + var(--top));width:min(280px,calc(100% - 24px));border-radius:26px;padding:8px;
  transform-origin:top right;transform:scale(.85) translateY(-8px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.scrim{position:absolute;inset:0;z-index:30;display:none}
.scrim.open{display:block}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:18px;text-align:left;font-weight:600;font-size:16px}
.mi:active{background:var(--accent-soft)}
.mi small{margin-left:auto;color:var(--muted);font-weight:400}

/* tab bar */
.tabs{position:absolute;z-index:20;left:14px;right:14px;bottom:calc(12px + var(--sab));height:68px;border-radius:34px;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:28px;background:var(--accent-soft);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--edge2);transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);transition:color .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--accent)}
.tab .ico{width:23px;height:23px}

/* home */
.hero{padding:22px 4px 6px;display:flex;flex-direction:column;gap:18px}
.hero .logo{width:76px;height:76px;border-radius:24px}
.title{margin:0;font-size:clamp(46px,14vw,68px);line-height:.92;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);font-size:16px;max-width:30ch;line-height:1.4}
.searchbtn{display:flex;align-items:center;gap:12px;width:100%;height:56px;border-radius:28px;padding:0 20px;color:var(--muted);font-size:16px;text-align:left}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.sec h2{margin:0;font-size:20px;font-weight:800}
.sec button{color:var(--accent);font-weight:600;font-size:14px;padding:6px 4px}
.daily{display:block;width:100%;text-align:left;border-radius:30px;padding:22px}
.daily .n{font-size:14px;color:var(--accent);font-weight:600}
.daily h3{margin:4px 0 10px;font-size:28px;font-weight:800;line-height:1.05}
.daily p{margin:0;font-family:Newsreader,Georgia,serif;font-size:18px;line-height:1.45;color:var(--muted);font-style:italic}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 18px;border-radius:20px;font-weight:600;font-size:15px}
.chip.on{color:var(--accent);background:var(--accent-soft)}

/* list */
.h1{margin:6px 4px 16px;font-size:36px;font-weight:800;letter-spacing:-.015em;line-height:1}
.field{display:flex;align-items:center;gap:10px;height:54px;border-radius:27px;padding:0 8px 0 18px;margin-bottom:14px;color:var(--muted)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;color:var(--text)}
.field input::placeholder{color:var(--muted)}
.field .clr{width:38px;height:38px;border-radius:19px;display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;border-radius:24px;padding:6px 6px 6px 8px}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;padding:8px 6px;border-radius:18px}
.num{flex:none;min-width:46px;height:46px;padding:0 6px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--accent);background:var(--accent-soft)}
.rt{display:flex;flex-direction:column;min-width:0}
.rt b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--muted);font-size:13.5px;margin-top:2px}
.heart{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;flex:none;color:var(--muted);transition:color .2s,transform .4s cubic-bezier(.3,1.8,.5,1)}
.heart:active{transform:scale(.8)}
.heart.on{color:var(--heart)}
.heart.on svg{fill:var(--heart);animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.empty{text-align:center;padding:48px 24px;color:var(--muted);line-height:1.5;font-size:16px}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:6px}
.filter{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 16px;border-radius:19px;margin:0 0 14px;font-weight:600;color:var(--accent);font-size:15px}
.filter span.x{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft)}

/* category */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{text-align:left;border-radius:28px;padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cat i{position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--tint);opacity:.55;filter:blur(2px)}
.cat b{font-size:21px;font-weight:800;line-height:1.05;position:relative;z-index:1}
.cat small{color:var(--muted);font-size:14px;position:relative;z-index:1}

/* lyrics */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.bar .sp{flex:1}
.bar .ib{background:var(--glass)}
.bar .ib.on{color:var(--heart)}
.bar .ib.on svg{fill:var(--heart)}
.lhead .no{display:inline-grid;place-items:center;height:34px;padding:0 14px;border-radius:17px;font-weight:800;color:var(--accent);background:var(--accent-soft);font-size:16px}
.lhead h1{margin:12px 0 4px;font-size:clamp(34px,10vw,46px);line-height:1;font-weight:800;letter-spacing:-.015em}
.lhead p{margin:0;color:var(--muted);font-size:15px}
.lyrics{margin-top:22px;border-radius:32px;padding:26px 24px;font-family:Newsreader,Georgia,serif;font-size:var(--lyric);line-height:1.6;transition:font-size .2s}
.st{margin:0 0 1.2em}
.st.ch{padding-left:16px;border-left:3px solid var(--accent);font-style:italic}
.st.ch::before{content:"Chorus";display:block;font-family:"Bricolage Grotesque",sans-serif;font-style:normal;font-size:.62em;font-weight:600;color:var(--accent);margin-bottom:4px}
.st:last-child{margin-bottom:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pn button{border-radius:24px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.pn button:last-child{text-align:right}
.pn small{color:var(--muted);font-size:13px}
.pn b{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn button[disabled]{opacity:.35;pointer-events:none}

/* settings */
.card{border-radius:28px;padding:20px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:18px;font-weight:800}
.card p{margin:0 0 14px;color:var(--muted);font-size:14.5px;line-height:1.45}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:24px;height:48px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--edge2)}
.seg button{position:relative;z-index:1;font-weight:600;font-size:15px;border-radius:20px;color:var(--muted);transition:color .25s}
.seg button.on{color:var(--accent)}
.seg .pill{top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:20px}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;accent-color:var(--accent);height:32px}
.preview{font-family:Newsreader,Georgia,serif;line-height:1.5;margin-top:10px;font-size:var(--lyric)}
.danger{width:100%;height:50px;border-radius:25px;color:var(--heart);font-weight:600;font-size:16px}

.toast{position:absolute;z-index:60;left:50%;bottom:calc(100px + var(--sab));transform:translate(-50%,20px);opacity:0;padding:12px 20px;border-radius:24px;font-weight:600;font-size:15px;pointer-events:none;transition:.35s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

/* ---------- theme ---------- */
function resolved(){return S.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):S.theme}
const CAP=window.Capacitor, NATIVE=!!((CAP&&CAP.isNativePlatform&&CAP.isNativePlatform())||window.AndroidInsets);
const FALLBACK_SAT="46px"; /* used only if the Android app cannot report the real status bar height */
function nativeBars(){
  if(!NATIVE)return;
  try{if(window.AndroidInsets&&AndroidInsets.setLightBars)AndroidInsets.setLightBars(resolved()==="light");}catch(e){}
}
function insetFallback(){
  if(!NATIVE)return;
  const root=document.documentElement.style;
  try{if(window.AndroidInsets&&AndroidInsets.getTop){
    root.setProperty("--native-sat",AndroidInsets.getTop()+"px");
    root.setProperty("--native-sab",AndroidInsets.getBottom()+"px");return}}catch(e){}
  const p=document.createElement("div");
  p.style.cssText="position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";
  document.body.appendChild(p);
  const h=parseFloat(getComputedStyle(p).paddingTop)||0;p.remove();
  if(h<1)root.setProperty("--native-sat",FALLBACK_SAT);
}
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",S.theme);
  const bg=getComputedStyle(r).getPropertyValue("--bg").trim();
  $('meta[name="theme-color"]').setAttribute("content",bg);
  $("#themeLbl").textContent=resolved()==="dark"?"Dark":"Light";
  nativeBars();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(S.theme==="auto")applyTheme()});
function setTheme(m){S.theme=m;ls.set("mfeb.theme",m);applyTheme();if(S.view==="settings")paintSeg()}
document.documentElement.style.setProperty("--lyric",S.size+"px");

/* ---------- fragments ---------- */
function row(s){const on=S.favs.has(s.n);
 return `<div class="row glass"><button class="rowmain press" data-open="${s.n}"><span class="num">${s.n}</span><span class="rt"><b>${s.t}</b><small>${s.c}</small></span></button>
 <button class="heart ${on?"on":""}" data-fav="${s.n}" aria-label="Favourite" aria-pressed="${on}">${IC.heart}</button></div>`}
function matches(){
  let a=SONGS;
  if(S.cat)a=a.filter(s=>s.c===S.cat);
  const q=norm(S.q.trim());
  if(q){ if(/^\d+$/.test(q)) a=a.filter(s=>String(s.n).startsWith(q));
         else a=a.filter(s=>norm(s.t+" "+s.c+" "+s.v.join(" ")+" "+s.ch.join(" ")).includes(q)); }
  return a;
}
function resultsHTML(){
  const a=matches();
  if(!a.length) return `<div class="empty"><b>Hla hmuh a ni lo</b>A hming emaw, a number emaw dang hmangin zawng leh rawh.</div>`;
  return a.map(row).join("");
}

     <button class="ib glass press" data-size="1" aria-label="A lian">${IC.plus}</button>
     <button class="ib glass press ${on?"on":""}" data-fav="${s.n}" aria-label="Favourite" aria-pressed="${on}">${IC.heart}</button>
   </div>
   <div class="lhead"><span class="no">Hla ${s.n}</span><h1>${s.t}</h1><p>${s.c}</p></div>
   <article class="lyrics glass">
     <p class="st">${s.v.join("<br>")}</p>
     <p class="st ch">${s.ch.join("<br>")}</p>
   </article>
   <div class="pn">
     <button class="glass press" data-open="${p?p.n:""}" ${p?"":"disabled"} data-dir="l"><small>Hla hmasa</small><b>${p?p.n+". "+p.t:"—"}</b></button>
     <button class="glass press" data-open="${n?n.n:""}" ${n?"":"disabled"} data-dir="r"><small>Hla lo thleng ang</small><b>${n?n.n+". "+n.t:"—"}</b></button>
   </div>
  </section>`},
 settings(){
  return `<section class="view"><h1 class="h1">Setting</h1>
   <div class="card glass"><h3>Dark / Light mode</h3><p>Phone setting zui tur emaw, i duh dan a thlang.</p>
     <div class="seg" id="seg"><span class="pill" id="segpill"></span>
       <button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div></div>
   <div class="card glass"><h3>Lyrics lian zawng</h3><p>Hla lyrics hriat theih dan tur siam rawh.</p>
     <div class="range"><span style="font-size:15px">A</span><input id="size" type="range" min="16" max="32" step="1" value="${S.size}" aria-label="Lyrics lian zawng"><span style="font-size:26px">A</span></div>
     <div class="preview" id="prev">Lalpa, kan fak che a ni</div></div>
   <div class="card glass"><h3>Favourite</h3><p>Favourite ${S.favs.size} i dah tawh.</p>
     <button class="danger press glass" data-clearfavs>Favourite zawng zawng paih</button></div>
   <div class="card glass"><h3>MFEB HLA BU</h3><p>Hla 50 hi sample-a siam a ni. I hla dik tak lyrics-in thlak thei a ni.</p></div>
  </section>`}
};

/* ---------- render / navigate ---------- */
let anim="in";
function render(){
  const sc=$("#scroll");
  sc.innerHTML=V[S.view]();
  const el=sc.firstElementChild; el.classList.add(anim); anim="in";
  sc.scrollTop=0;
  const tabIdx={home:0,list:1,favs:2,cats:3}[S.tab];
  const pill=$("#pill");
  if(S.view==="settings"){pill.style.opacity=0}
  else{pill.style.opacity=1;pill.style.transform=`translateX(${tabIdx*100}%)`}
  $$(".tab").forEach((b,i)=>b.classList.toggle("on",S.view!=="settings"&&i===tabIdx));
  if(S.view==="list")bindList();
  if(S.view==="settings"){paintSeg();bindSettings()}
}
function go(view,tab){S.view=view;if(tab)S.tab=tab;render()}
function openSong(n,dir){
  S.songId=n;S.view="song";anim=dir==="l"?"in-l":"in-r";
  S.recent=[n,...S.recent.filter(x=>x!==n)].slice(0,8);ls.set("mfeb.recent",S.recent);
  render();
}
function bindList(){
  const q=$("#q"),clr=$("#clr");
  q.addEventListener("input",()=>{S.q=q.value;$("#results").innerHTML=resultsHTML();clr.style.visibility=S.q?"visible":"hidden"});
  clr.addEventListener("click",()=>{S.q="";q.value="";q.dispatchEvent(new Event("input"));q.focus()});
}
function paintSeg(){
  const i=["auto","light","dark"].indexOf(S.theme);
  $("#segpill").style.transform=`translateX(${i*100}%)`;
  $$("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.theme===S.theme));
}
function bindSettings(){
  $("#size").addEventListener("input",e=>{S.size=+e.target.value;document.documentElement.style.setProperty("--lyric",S.size+"px");ls.set("mfeb.size",S.size)});
}
function setFav(n){
  if(S.favs.has(n))S.favs.delete(n);else S.favs.add(n);
  ls.set("mfeb.favs",[...S.favs]);
  const on=S.favs.has(n);
  $$(`[data-fav="${n}"]`).forEach(b=>{b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  toast(on?"Favourite-ah dah a ni":"Favourite atangin paih a ni");
  if(S.view==="favs")setTimeout(()=>{if(S.view==="favs"){const y=$("#scroll").scrollTop;anim="";render();$("#scroll").scrollTop=y}},350);
}
function closeMenu(){$("#menu").classList.remove("open");$("#scrim").classList.remove("open");$("[data-menu]").setAttribute("aria-expanded","false")}
function copyLyrics(){
  const s=byId(S.songId);
  const txt=`${s.n}. ${s.t}\n\n${s.v.join("\n")}\n\nChorus:\n${s.ch.join("\n")}`;
  const ok=()=>toast("Lyrics copy a ni");
  const fb=()=>{const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity=0;document.body.appendChild(t);t.select();
    try{document.execCommand("copy")?ok():toast("Copy theih a ni lo")}catch(e){toast("Copy theih a ni lo")}t.remove()};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-menu],.scrim");if(!t)return;
  const d=t.dataset;
  if(t.id==="scrim"||t.classList.contains("scrim")){closeMenu();return}
  if("menu" in d){const o=$("#menu").classList.toggle("open");$("#scrim").classList.toggle("open",o);t.setAttribute("aria-expanded",o);return}
  if("toggleTheme" in d){setTheme(resolved()==="dark"?"light":"dark");return}
  if(d.theme){setTheme(d.theme);return}
  if("nav" in d){closeMenu();
    if(d.nav==="settings"){go("settings")}
    else{ if(d.nav==="list"){S.cat=null} go(d.nav,d.nav)}
    return}
  if("search" in d){closeMenu();S.cat=null;go("list","list");setTimeout(()=>$("#q")?.focus(),350);return}
  if(d.cat){S.cat=d.cat;S.q="";go("list","list");return}
  if("clearcat" in d){S.cat=null;anim="";render();return}
  if(d.fav){setFav(+d.fav);return}
  if(d.open!==undefined&&d.open!==""){openSong(+d.open,d.dir);return}
  if("back" in d){anim="in-l";go(S.tab==="settings"?"home":S.tab,S.tab);return}
  if("copy" in d){copyLyrics();return}
  if(d.size){S.size=Math.min(34,Math.max(15,S.size+ +d.size*2));document.documentElement.style.setProperty("--lyric",S.size+"px");ls.set("mfeb.size",S.size);return}
  if("clearfavs" in d){S.favs.clear();ls.set("mfeb.favs",[]);toast("Favourite zawng zawng paih a ni");anim="";render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

insetFallback();
applyTheme();
render();
</script>
</body>
</html>
